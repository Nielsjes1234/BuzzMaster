name: Release

on:
  release:
    types: [published]

jobs:
  build:
    name: Build and publish Windows release
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify release tag matches app version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Release tag $env:RELEASE_TAG does not match package.json version $version (expected v$version)."
          }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install electron dependencies
        run: pnpm install --frozen-lockfile --dir src-electron

      - name: Build and publish release assets
        run: pnpm exec quasar build -m electron --publish onTag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
